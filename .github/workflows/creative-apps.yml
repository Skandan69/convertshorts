name: Creative apps integration
on:
  pull_request:
    paths:
      - 'apps/**'
      - 'scripts/**'
      - 'tests/creative-apps*'
      - 'vercel.json'
      - 'api/**'
      - 'server/**'
      - 'tests/studio-*'
      - 'package.json'
      - '.github/workflows/creative-apps.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: node scripts/build-creative-apps.mjs
      - run: node tests/creative-apps.mjs
      - run: node tests/studio-api.mjs
      - run: node tests/studio-services.mjs
      - run: node tests/studio-pricing.mjs
      - name: Install browser test runtime
        run: |
          npm install --prefix tests --no-save --package-lock=false --ignore-scripts playwright@1.62.1
          tests/node_modules/.bin/playwright install --with-deps chromium
          sudo apt-get install -y ffmpeg
      - name: Start browser fixture server
        run: python tests/serve.py > /tmp/convertshorts-server.log 2>&1 &
      - name: Verify seven browser engines
        run: node tests/creative-apps-browser.cjs
      - name: Verify base studio
        if: ${{ !cancelled() && success() }}
        run: node tests/studio-browser.cjs
      - name: Verify composer prices
        if: ${{ !cancelled() }}
        run: node tests/studio-pricing-browser.cjs
      - name: Verify visible controls and guided canvas
        if: ${{ !cancelled() }}
        run: node tests/studio-controls-browser.cjs
      - name: Verify advanced studio workflows
        if: ${{ !cancelled() }}
        run: node tests/studio-advanced-browser.cjs
      - name: Verify cloud lifecycle
        if: ${{ !cancelled() }}
        run: node tests/studio-cloud-browser.cjs
      - name: Save browser screenshots and startup results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: creative-apps-results
          path: tests/results/creative-apps/
          retention-days: 7
