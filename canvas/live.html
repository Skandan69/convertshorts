<!DOCTYPE html>
<html lang="en">
<head>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-BFWSBHKF1P"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag("js",new Date());gtag("config","G-BFWSBHKF1P");</script>

<meta name="robots" content="noindex,follow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Join the class</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--line:#e2e6ef;--txt:#1b1f27;--dim:#6b7280;--acc:#2f6df6;--ok:#12a150;--bad:#e0483d}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--txt);
  font:16px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:24px 18px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;
  margin-bottom:14px;box-shadow:0 10px 30px #0f172a14}
h1{font-size:26px;margin:0 0 4px}
.sub{color:var(--dim);margin:0 0 20px}
input,textarea{font:inherit;width:100%;border:1px solid var(--line);border-radius:11px;padding:12px;outline:none}
input:focus,textarea:focus{border-color:var(--acc)}
#code{text-transform:uppercase;letter-spacing:8px;font-size:26px;font-weight:800;text-align:center}
button{font:inherit;border:0;border-radius:11px;padding:13px 20px;background:var(--acc);color:#fff;
  font-weight:650;cursor:pointer;width:100%}
button:disabled{opacity:.45}
#q{font-size:clamp(20px,3vw,30px);font-weight:750;line-height:1.3;margin:0 0 6px}
#ans{min-height:210px;font-size:18px;line-height:1.6}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tiny{font-size:12.5px;color:var(--dim)}
#clock{font-variant-numeric:tabular-nums;font-weight:800;font-size:24px}
#clock.low{color:var(--bad)}
.hide{display:none}
.ok{background:var(--ok)}
</style>
  <script type="module" crossorigin src="/canvas/assets/live-AObElFSh.js"></script>
  <link rel="modulepreload" crossorigin href="/canvas/assets/config-pBieaFJY.js">
</head>
<body>
<div class="wrap">
  <div id="joinView">
    <h1>Join the class</h1>
    <p class="sub">Ask your teacher for the five-letter code.</p>
    <div class="card">
      <input id="code" maxlength="5" placeholder="ABCDE" autocomplete="off">
      <input id="name" placeholder="Your name" style="margin-top:12px" autocomplete="off">
      <button id="joinBtn" style="margin-top:14px">Join</button>
      <p class="tiny" id="joinMsg" style="margin:10px 0 0"></p>
    </div>
  </div>

  <div id="answerView" class="hide">
    <div class="row"><span class="tiny" id="asName"></span><span id="clock"></span></div>
    <div class="card"><div id="q"></div></div>
    <div class="card">
      <textarea id="ans" placeholder="Type your answer…"></textarea>
      <div class="row" style="margin-top:10px">
        <span class="tiny" id="words">0 words</span>
        <span class="tiny" id="saveState">your teacher can see this as you type</span>
      </div>
      <button id="send" style="margin-top:12px">Hand it in</button>
    </div>
  </div>
</div>
</body>
</html>
